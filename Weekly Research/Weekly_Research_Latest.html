<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apex Weekly Research Note</title>
  <style>
    :root{--cream:#f4ecdc;--paper:#fffaf0;--teal:#003f46;--gold:#b8872f;--ink:#173236;--muted:#61706d;--rule:#d8c7a9}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f4ecdc,#ddc599);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.55;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{max-width:860px;width:100%;background:var(--paper);border:1px solid var(--rule);border-top:6px solid var(--teal);box-shadow:0 22px 62px rgba(45,34,18,.18);padding:34px;border-radius:8px}
    .tag{display:inline-block;color:var(--gold);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
    h1{margin:0 0 12px;color:var(--teal);font-size:38px;line-height:1.05}
    p{color:var(--muted);font-size:17px;margin:0 0 18px;max-width:720px}.button{display:inline-block;background:#123846;color:#fffaf0;text-decoration:none;padding:11px 14px;border-radius:5px;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">Latest Weekly Report</span>
    <h1>Apex Weekly Research Note</h1>
    <p>This is the stable latest-report slot for Apex Macro Research. Replace this file each week with the current exported HTML research note so the homepage button keeps working.</p>
    <a class="button" href="../index.html">Back to Dashboard Suite</a>
  </main>
</body>
</html>
